apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs
  namespace: {{ .Values.docs.namespace }}
spec:
  replicas: {{ .Values.docs.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: docs
  template:
    metadata:
      labels:
        app: docs
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      {{- include "cyberpulse.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: docs
          image: {{ include "cyberpulse.image" (list . "docs") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: 80
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          volumeMounts:
            - name: nginx-tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: nginx-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: docs
  namespace: {{ .Values.docs.namespace }}
spec:
  selector:
    app: docs
  ports:
    - port: 80
      targetPort: 80
