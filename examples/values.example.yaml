images:
  prefix: ghcr.io/solutionscst
  tag: v1.2.0

fastapi:
  corsOrigins: "https://pulse.customer.example"
  enableHsts: "true"
  enableApiDocs: "false"
  kubernetesApiEgress:
    # Default k3s Kubernetes service IP. install.sh also auto-adds the real
    # Kubernetes API EndpointSlice target, such as 192.168.x.x:6443.
    cidr: 10.43.0.1/32
    port: 443
    endpoints: []

reports:
  storage: 20Gi

ingress:
  enabled: true
  # Leave host empty to expose CyberPulse on the server IP over HTTP.
  host: ""
  className: traefik

cloudflare:
  tunnel:
    enabled: false
